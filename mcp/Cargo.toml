[package]
name = "alsxaplus-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "alsxaplus-mcp"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
dotenvy = "=0.15.7"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.5.1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
sha2 = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "uuid", "chrono", "macros", "json"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
unicode-normalization = "=0.1.26"

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }

# Debug builds of this crate once grew very large. Line tables are enough for backtraces and keep the output small.
[profile.dev]
debug = "line-tables-only"
